<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1930 : 무법의 시대</title>
  <!-- 서부시대 및 빈티지 느낌을 살리는 구글 웹폰트 -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Black+Han+Sans&family=Cinzel+Decorative:wght@700;900&family=Noto+Serif+KR:wght@600;900&family=Rye&display=swap" rel="stylesheet">
  
  <style>
    /* 기본 리셋 및 전체 황야 배경 설정 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Serif KR', serif;
      color: #e6d5b8;
      /* 1930년대 어둡고 거친 만주 황야 느낌의 다크 그라데이션 배경 */
      background: radial-gradient(circle at 50% 45%, #3a2718 0%, #1c120a 55%, #0c0704 100%);
    }

    /* 모래 입자 및 바람 띠 캔버스 */
    #desert-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 황야의 거친 빈티지 비네팅 오버레이 */
    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 130px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 2;
    }

    /* 상단 헤더 바 */
    header {
      position: relative;
      z-index: 20;
      width: 100%;
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(12, 7, 4, 0.85), rgba(12, 7, 4, 0.2));
    }

    /* 하단 금빛·청동빛 구분선 */
    header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #5c3a18 0%, #d4af37 30%, #f3d06b 50%, #cd7f32 70%, #5c3a18 100%);
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.4);
    }

    /* 왼쪽 상단 타이틀 */
    .site-title {
      font-family: 'Rye', 'Black Han Sans', serif;
      font-size: clamp(1.3rem, 3vw, 2.1rem);
      letter-spacing: 2px;
      color: #e8c37d;
      text-shadow: 2px 3px 0px #2b1708, 0 0 15px rgba(212, 175, 55, 0.4);
      cursor: pointer;
    }

    /* 오른쪽 상단 햄버거 메뉴 버튼 (가로선 3개) */
    .hamburger-btn {
      width: 36px;
      height: 28px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px 0;
      z-index: 25;
      transition: transform 0.2s ease;
    }

    .hamburger-btn:hover {
      transform: scale(1.08);
    }

    .hamburger-btn span {
      display: block;
      width: 100%;
      height: 3.5px;
      background: linear-gradient(90deg, #d4af37, #cd7f32);
      border-radius: 2px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      transition: all 0.3s ease;
    }

    /* 메인 중앙 영역 */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      height: calc(100vh - 76px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px 20px 30px;
    }

    /* 현상금 수배서 컨테이너 */
    .poster-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 90vw;
      max-height: 68vh;
    }

    /* 수배서 이미지 */
    #wanted-poster {
      max-width: 100%;
      max-height: 68vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.85), 0 0 25px rgba(184, 134, 11, 0.2);
      transition: transform 0.1s ease;
    }

    /* 수배서 타격 흔들림 애니메이션 */
    @keyframes posterImpactShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-10px, 8px) rotate(-1.5deg); }
      30% { transform: translate(9px, -7px) rotate(1.5deg); }
      45% { transform: translate(-7px, -5px) rotate(-1deg); }
      60% { transform: translate(6px, 6px) rotate(1deg); }
      75% { transform: translate(-4px, 3px) rotate(-0.5deg); }
      90% { transform: translate(3px, -2px) rotate(0.5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .shake-impact {
      animation: posterImpactShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* 동그라미 '시작' 도장 스타일 */
    .stamp-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(130px, 24vw, 190px);
      height: clamp(130px, 24vw, 190px);
      transform: translate(-50%, -50%) scale(3.5) rotate(-14deg);
      border: 6px solid rgba(185, 22, 22, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: rgba(185, 22, 22, 0.92);
      font-family: 'Noto Serif KR', serif;
      font-weight: 900;
      font-size: clamp(2.1rem, 4.5vw, 3.3rem);
      letter-spacing: 6px;
      padding-left: 6px;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      box-shadow: inset 0 0 12px rgba(185, 22, 22, 0.5), 0 0 15px rgba(185, 22, 22, 0.4);
      text-shadow: 1px 1px 2px rgba(80, 0, 0, 0.6);
    }

    /* 도장 내부 이중 원 테두리 */
    .stamp-mark::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border: 2.5px solid rgba(185, 22, 22, 0.85);
      border-radius: 50%;
    }

    /* 도장이 위에서 아래로 쾅 찍히는 애니메이션 */
    @keyframes stampSlam {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(3.8) rotate(-22deg);
      }
      65% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.94) rotate(-12deg);
      }
      80% {
        transform: translate(-50%, -50%) scale(1.03) rotate(-14deg);
      }
      100% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(1) rotate(-13deg);
      }
    }

    .stamp-active {
      animation: stampSlam 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 수배서 아래 바깥 여백 버튼 그룹 (DEAD OR ALIVE 절대 가리지 않음) */
    .action-buttons {
      margin-top: 22px;
      display: flex;
      gap: 18px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      z-index: 12;
    }

    .western-btn {
      padding: 13px 28px;
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(0.95rem, 1.5vw, 1.15rem);
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #f3e2c7;
      background: linear-gradient(180deg, #4a2e16 0%, #26160a 100%);
      border: 2px solid #c59b47;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 223, 150, 0.3);
      transition: all 0.2s ease;
    }

    .western-btn:hover {
      background: linear-gradient(180deg, #633e1e 0%, #36200f 100%);
      border-color: #f0c96e;
      color: #fff5e4;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.35);
    }

    .western-btn:active {
      transform: translateY(1px);
    }

    /* 사이드 메뉴 어두운 배경 오버레이 */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(2px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      z-index: 30;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    /* 오른쪽 햄버거 사이드 메뉴 패널 */
    nav.side-menu {
      position: fixed;
      top: 0;
      right: -320px;
      width: 290px;
      max-width: 80vw;
      height: 100%;
      background: linear-gradient(160deg, #24150b 0%, #120a05 100%);
      border-left: 2px solid #b8860b;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.9);
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      transition: right 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 40;
    }

    nav.side-menu.open {
      right: 0;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.4);
    }

    .menu-header span {
      font-family: 'Rye', serif;
      color: #d4af37;
      font-size: 1.15rem;
      letter-spacing: 1px;
    }

    .close-menu-btn {
      background: none;
      border: none;
      color: #d4af37;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .close-menu-btn:hover {
      transform: rotate(90deg);
      color: #fff;
    }

    .menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-item-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 4px;
      color: #e6d5b8;
      font-family: 'Noto Serif KR', serif;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-item-btn:hover {
      background: rgba(212, 175, 55, 0.16);
      border-color: #d4af37;
      color: #ffe8b3;
      padding-left: 22px;
    }

    /* 오른쪽 하단 배경음악(BGM) 토글 버튼 */
    .bgm-toggle-btn {
      position: fixed;
      bottom: 22px;
      right: 24px;
      z-index: 25;
      padding: 10px 18px;
      background: rgba(20, 12, 6, 0.88);
      border: 1.5px solid #b8860b;
      border-radius: 30px;
      color: #e8c37d;
      font-family: 'Noto Serif KR', serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
    }
