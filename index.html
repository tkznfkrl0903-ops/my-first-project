<script>
var stamped=false,playing=false,tmr=null,ctx=null;

function openM(){
  document.getElementById('sb').style.right='0';
  document.getElementById('ov').style.display='block';
}

function closeM(){
  document.getElementById('sb').style.right='-280px';
  document.getElementById('ov').style.display='none';
}

function getC(){
  if(!ctx){
    var A=window.AudioContext||window.webkitAudioContext;
    if(A)ctx=new A();
  }
  if(ctx&&ctx.state==='suspended')ctx.resume();
  return ctx;
}

function sound(){
  try{
    var c=getC();
    if(!c)return;
    var o=c.createOscillator(),g=c.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(140,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(35,c.currentTime+.15);
    g.gain.setValueAtTime(1,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.18);
    o.connect(g);
    g.connect(c.destination);
    o.start();
    o.stop(c.currentTime+.18);
  }catch(e){}
}

function go(id){
  closeM();
  var t=document.getElementById(id);
  if(!stamped){
    stamped=true;
    document.getElementById('st').classList.add('on');
    sound();
    setTimeout(function(){if(t)t.scrollIntoView({behavior:'smooth'})},550);
  }else{
    if(t)t.scrollIntoView({behavior:'smooth'});
  }
}

/* 누락되었던 세력 필터 기능 */
function filt(role, btn){
  var btns = document.querySelectorAll('.f-btn');
  btns.forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');

  var cards = document.querySelectorAll('.c-card');
  cards.forEach(function(c){
    if(role === 'all' || c.getAttribute('data-role') === role){
      c.style.display = 'block';
    } else {
      c.style.display = 'none';
    }
  });
}

/* 누락되었던 배경음악(신디사이저 루프) 기능 */
function togM(){
  var btn = document.getElementById('mb');
  var c = getC();
  if(!playing){
    playing = true;
    btn.classList.add('on');
    btn.textContent = '🔊 음악 끄기';
    var notes = [110, 130.81, 146.83, 164.81, 130.81, 146.83];
    var idx = 0;
    tmr = setInterval(function(){
      if(!c) return;
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(notes[idx % notes.length], c.currentTime);
      g.gain.setValueAtTime(0.08, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.7);
      o.connect(g);
      g.connect(c.destination);
      o.start();
      o.stop(c.currentTime + 0.7);
      idx++;
    }, 750);
  } else {
    playing = false;
    btn.classList.remove('on');
    btn.textContent = '🔇 음악 켜기';
    clearInterval(tmr);
  }
}
</script>
</body>
</html>
