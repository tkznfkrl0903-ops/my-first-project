<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1930 - 무법의 시대</title>
  <!-- 서부시대(웨스턴) 스타일 영문 폰트 & 묵직한 한글 명조 폰트 불러오기 -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Rye&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #3b2616 0%, #170e08 75%, #0a0604 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: 'Noto Serif KR', 'Malgun Gothic', serif;
      position: relative;
    }

    /* 거친 필름 및 모래바람 질감 효과 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.12) 0px,
        rgba(0, 0, 0, 0.12) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* 상단 헤더 영역 (왼쪽 제목 + 오른쪽 선 3개 메뉴 + 아래 구분선) */
    .top-header {
      position: relative;
      z-index: 20;
      width: 100%;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(12, 7, 4, 0.85) 0%, rgba(12, 7, 4, 0.3) 100%);
      border-bottom: 2px solid #8c6239;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.65);
    }

    /* 서부시대 글씨체 제목 */
    .site-title {
      font-family: 'Rye', 'Noto Serif KR', serif;
      font-size: clamp(20px, 3.8vw, 30px);
      color: #e6c384;
      letter-spacing: 2px;
      text-shadow: 2px 3px 0px #1a0d06, 0 0 12px rgba(230, 195, 132, 0.25);
      user-select: none;
    }

    /* 오른쪽 상단 선 3개(햄버거 메뉴) 버튼 */
    .hamburger-btn {
      width: 38px;
      height: 32px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 2px;
      transition: transform 0.2s ease;
    }

    .hamburger-btn:hover {
      transform: scale(1.08);
    }

    .hamburger-btn span {
      display: block;
      width: 100%;
      height: 3.5px;
      background-color: #e6c384;
      border-radius: 2px;
      box-shadow: 1px 2px 2px rgba(0, 0, 0, 0.8);
      transition: all 0.25s ease;
    }

    .hamburger-btn:hover span {
      background-color: #fff0d4;
    }

    /* 선 3개 눌렀을 때 열리는 사이드 메뉴 서랍 */
    .side-drawer {
      position: fixed;
      top: 0;
      right: -280px;
      width: 260px;
      height: 100vh;
      background: linear-gradient(180deg, #1f1209 0%, #120a05 100%);
      border-left: 2px solid #8c6239;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.85);
      z-index: 30;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: right 0.3s ease;
    }

    .side-drawer.open {
      right: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #5e4024;
      color: #e6c384;
      font-family: 'Rye', 'Noto Serif KR', serif;
      font-size: 18px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #e6c384;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
    }

    .drawer-item {
      padding: 12px 14px;
      background-color: #2b190e;
      color: #e6c896;
      border: 1px solid #5e4024;
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .drawer-item:hover {
      background-color: #7a1c12;
      color: #fff5e4;
      border-color: #e6c384;
    }

    /* 중앙 수배서 배치 영역 */
    .main-stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      position: relative;
      z-index: 2;
    }

    /* 합성된 수배서 이미지 전체 컨테이너 */
    .poster-wrapper {
      position: relative;
      width: min(90vw, 490px, 63vh);
      aspect-ratio: 416 / 550;
      background-image: url('poster.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow: 0 28px 65px rgba(0, 0, 0, 0.88), 0 0 30px rgba(212, 163, 89, 0.18);
      transform: rotate(-1deg);
      transition: transform 0.25s ease;
    }

    /* 하단 중앙 버튼 영역 */
    .action-area {
      position: absolute;
      bottom: 8.2%;
      left: 11%;
      width: 78%;
      text-align: center;
    }

    .sub-caption {
      font-size: clamp(11px, 2.4vw, 14px);
      font-weight: 800;
      color: #2b1a0e;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .menu-btn {
      flex: 1;
      padding: 12px 8px;
      background-color: #26160c;
      color: #e6c896;
      border: 2px solid #4a2c18;
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(13px, 3.2vw, 17px);
      font-weight: bold;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .menu-btn.secondary {
      background-color: #3d2414;
      color: #f0d7ad;
    }

    .menu-btn:hover {
      background-color: #7a1c12;
      color: #fff5e4;
      border-color: #26160c;
      transform: translateY(-2px);
    }

    .menu-btn:active {
      transform: translateY(1px);
    }

    /* 큼직한 붉은색 동그라미 인주 도장 스타일 및 애니메이션 */
    .stamp {
      position: absolute;
      top: 45%;
      left: 50%;
      width: clamp(180px, 44vw, 245px);
      height: clamp(180px, 44vw, 245px);
      border-radius: 50%;
      border: 9px solid rgba(175, 20, 20, 0.92);
      outline: 3px solid rgba(175, 20, 20, 0.8);
      outline-offset: -17px;
      color: rgba(175, 20, 20, 0.94);
      font-size: clamp(50px, 12vw, 72px);
      font-weight: 900;
      letter-spacing: 6px;
      padding-left: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(175, 20, 20, 0.09);
      box-shadow: inset 0 0 18px rgba(175, 20, 20, 0.5), 0 0 12px rgba(175, 20, 20, 0.25);
      transform: translate(-50%, -50%) scale(3) rotate(-18deg);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      user-select: none;
    }

    .stamp.stamped {
      animation: stampSlam 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes stampSlam {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(3.4) rotate(-25deg);
      }
      70% {
        opacity: 0.96;
        transform: translate(-50%, -50%) scale(0.94) rotate(-12deg);
      }
      100% {
        opacity: 0.93;
        transform: translate(-50%, -50%) scale(1) rotate(-14deg);
      }
    }
  </style>
</head>
<body>

  <!-- 상단 헤더: 왼쪽 서부시대 글씨체 제목 + 오른쪽 선 3개 메뉴 + 아래 구분선 -->
  <header class="top-header">
    <div class="site-title">1930 : 무법의 시대</div>
    <button class="hamburger-btn" onclick="toggleMenu()" aria-label="메뉴 열기">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- 오른쪽 상단 선 3개 클릭 시 열리는 메뉴 창 -->
  <nav class="side-drawer" id="sideDrawer">
    <div class="drawer-header">
      <span>MENU</span>
      <button class="close-btn" onclick="toggleMenu()">&times;</button>
    </div>
    <button class="drawer-item" onclick="toggleMenu(); triggerStamp('프롤로그', 'prologue.html')">프롤로그 열기</button>
    <button class="drawer-item" onclick="toggleMenu(); triggerStamp('캐릭터 보기', 'characters.html')">캐릭터 보기</button>
  </nav>

  <!-- 중앙 현상금 수배서 무대 -->
  <main class="main-stage">
    <div class="poster-wrapper" id="poster">
      <!-- 동그라미 도장 연출 요소 -->
      <div class="stamp" id="stampMark">시작</div>

      <!-- 하단 중앙 버튼 영역 -->
      <div class="action-area">
        <div class="sub-caption">REWARD : $10,000 GOLD</div>
        <div class="btn-group">
          <button class="menu-btn" onclick="triggerStamp('프롤로그', 'prologue.html')">프롤로그 열기</button>
          <button class="menu-btn secondary" onclick="triggerStamp('캐릭터 보기', 'characters.html')">캐릭터 보기</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let isStamping = false;
    let audioCtx = null;

    function toggleMenu() {
      const drawer = document.getElementById('sideDrawer');
      drawer.classList.toggle('open');
    }

    function playStampSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;

      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(110, now);
      subOsc.frequency.exponentialRampToValueAtTime(28, now + 0.25);

      subGain.gain.setValueAtTime(1.2, now);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

      subOsc.connect(subGain);
      subGain.connect(audioCtx.destination);
      subOsc.start(now);
      subOsc.stop(now + 0.28);

      const woodOsc = audioCtx.createOscillator();
      const woodGain = audioCtx.createGain();
      woodOsc.type = 'triangle';
      woodOsc.frequency.setValueAtTime(280, now);
      woodOsc.frequency.exponentialRampToValueAtTime(65, now + 0.08);

      woodGain.gain.setValueAtTime(0.85, now);
      woodGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      woodOsc.connect(woodGain);
      woodGain.connect(audioCtx.destination);
