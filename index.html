<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1930 - 무법의 시대</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Rye&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 42%, #59381d 0%, #2b190d 55%, #120a05 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: 'Noto Serif KR', 'Malgun Gothic', serif;
      position: relative;
    }

    /* 황야의 모래바람 배경 효과 */
    .desert-atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .sand-wind {
      position: absolute;
      left: -100%;
      width: 200%;
      height: 140px;
      background: linear-gradient(90deg, transparent 0%, rgba(218, 168, 108, 0.1) 25%, rgba(235, 190, 130, 0.18) 50%, rgba(218, 168, 108, 0.1) 75%, transparent 100%);
      filter: blur(18px);
      animation: windBlow 7s linear infinite;
    }
    .sand-wind.wind-1 { top: 28%; animation-duration: 6.5s; }
    .sand-wind.wind-2 { top: 58%; animation-duration: 8.5s; animation-delay: -3s; height: 180px; }
    .sand-wind.wind-3 { bottom: 8%; animation-duration: 5.5s; animation-delay: -1.5s; height: 110px; }
    @keyframes windBlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(50%); }
    }
    .dust-particle {
      position: absolute;
      background-color: rgba(235, 192, 132, 0.6);
      border-radius: 50%;
      animation: dustFly linear infinite;
    }
    @keyframes dustFly {
      0% { transform: translateX(-10vw) translateY(0); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateX(110vw) translateY(-35px); opacity: 0; }
    }

    /* 상단 헤더 */
    .top-header {
      position: relative;
      z-index: 20;
      width: 100%;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(12, 7, 4, 0.88) 0%, rgba(12, 7, 4, 0.35) 100%);
      border-bottom: 2px solid #8c6239;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.65);
    }
    .site-title {
      font-family: 'Rye', 'Noto Serif KR', serif;
      font-size: clamp(20px, 3.8vw, 30px);
      color: #e6c384;
      letter-spacing: 2px;
      text-shadow: 2px 3px 0px #1a0d06;
      user-select: none;
    }
    .hamburger-btn {
      width: 38px;
      height: 32px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 2px;
      transition: transform 0.2s ease;
    }
    .hamburger-btn:hover {
      transform: scale(1.08);
    }
    .hamburger-btn span {
      display: block;
      width: 100%;
      height: 3.5px;
      background-color: #e6c384;
      border-radius: 2px;
    }

    /* 메뉴 열렸을 때 뒷배경 어둡게 처리 */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.55);
      z-index: 45;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .drawer-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* 오른쪽 햄버거 메뉴 창 */
    .side-drawer {
      position: fixed;
      top: 0;
      right: -290px;
      width: 270px;
      height: 100vh;
      background: linear-gradient(180deg, #1f1209 0%, #120a05 100%);
      border-left: 2px solid #8c6239;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.9);
      z-index: 50;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: right 0.3s ease;
    }
    .side-drawer.open { right: 0; }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      margin-bottom: 4px;
      border-bottom: 2px solid #5e4024;
      color: #e6c384;
      font-family: 'Rye', 'Noto Serif KR', serif;
      font-size: 20px;
      letter-spacing: 2px;
    }
    .close-btn {
      background: none;
      border: none;
      color: #e6c384;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
    }
    .drawer-item {
      padding: 13px 16px;
      background-color: #2b190e;
      color: #e6c896;
      border: 1px solid #5e4024;
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .drawer-item:hover {
      background-color: #7a1c12;
      color: #fff5e4;
      border-color: #e6c384;
      transform: translateX(-4px);
    }

    /* 중앙 무대: 수배서와 그 아래 버튼을 세로로 정렬 */
    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      padding: 10px;
      position: relative;
      z-index: 10;
    }

    /* 수배서 컨테이너 */
    .poster-wrapper {
      position: relative;
      width: min(85vw, 440px, 56vh);
      aspect-ratio: 416 / 550;
      background-color: #c8a265;
      background-image: url('poster.png'), url('poster.jpg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.88);
      transform: rotate(-1deg);
      transition: transform 0.2s ease;
    }

    /* 수배서 바로 아래 바깥에 배치된 버튼 그룹 */
    .action-area {
      width: min(85vw, 440px);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      z-index: 25;
    }
    .menu-btn {
      flex: 1;
      padding: 13px 10px;
      background-color: #26160c;
      color: #e6c896;
      border: 2px solid #8c6239;
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(14px, 3.4vw, 18px);
      font-weight: bold;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .menu-btn.secondary { background-color: #3d2414; color: #f0d7ad; }
    .menu-btn:hover {
      background-color: #7a1c12;
      color: #fff5e4;
      border-color: #e6c384;
      transform: translateY(-2px);
    }

    /* 붉은색 동그라미 '시작' 도장 */
    .stamp {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(180px, 44vw, 240px);
      height: clamp(180px, 44vw, 240px);
      border-radius: 50%;
      border: 9px solid #c91414;
      outline: 3px solid #c91414;
      outline-offset: -17px;
      color: #c91414;
      font-size: clamp(50px, 12vw, 72px);
      font-weight: 900;
      letter-spacing: 6px;
      padding-left: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(255, 240, 235, 0.22);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.65);
      box-shadow: inset 0 0 22px rgba(201, 20, 20, 0.65), 0 0 20px rgba(0, 0, 0, 0.65);
      transform: translate(-50%, -50%) scale(3) rotate(-15deg);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      user-select: none;
    }
    .stamp.show {
      animation: stampDrop 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }
    @keyframes stampDrop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(3.2) rotate(-25deg); }
      70% { opacity: 1; transform: translate(-50%, -50%) scale(0.94) rotate(-12deg); }
      100% { opacity: 0.96; transform: translate(-50%, -50%) scale(1) rotate(-14deg); }
    }

    /* 오른쪽 하단 음악 켜기/끄기 버튼 */
    .music-toggle-btn {
      position: fixed;
      bottom: 20px;
      right: 22px;
      z-index: 45;
      padding: 10px 18px;
      background-color: rgba(32, 18, 10, 0.94);
      color: #e6c384;
      border: 2px solid #8c6239;
      border-radius: 30px;
      font-family: 'Noto Serif KR', serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.75);
      transition: all 0.2s ease;
    }
    .music-toggle-btn:hover {
      background-color: #5e2214;
      color: #fff5e4;
      border-color: #e6c384;
    }
    .music-toggle-btn.playing {
      background-color: #4f1d12;
      border-color: #e6c384;
      color: #fff5e4;
      box-shadow: 0 0 15px rgba(217, 155, 67, 0.5);
    }
  </style>
</head>
<body>

  <audio id="bgmAudio" src="bgm.mp3" loop preload="auto"></audio>
  <audio id="stampAudio" src="stamp.mp3" preload="auto"></audio>

  <div class="desert-atmosphere" id="desertLayer">
    <div class="sand-wind wind-1"></div>
    <div class="sand-wind wind-2"></div>
    <div class="sand-wind wind-3"></div>
  </div>

  <!-- 상단 헤더 -->
  <header class="top-header">
    <div class="site-title">1930 : 무법의 시대</div>
    <button class="hamburger-btn" id="menuOpenBtn" aria-label="메뉴 열기">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- 오른쪽 햄버거 메뉴 배경 및 서랍 -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <nav class="side-drawer" id="sideDrawer">
    <div class="drawer-header">
      <span>MENU</span>
      <button class="close-btn" id="menuCloseBtn">&times;</button>
    </div>
    <button class="drawer-item" data-menu="세계관" data-page="world.html">세계관</button>
    <button class="drawer-item" data-menu="프롤로그 웹툰" data-page="webtoon.html">프롤로그 웹툰</button>
    <button class="drawer-item" data-menu="세력" data-page="factions.html">세력</button>
    <button class="drawer-item" data-menu="캐릭터" data-page="characters.html">캐릭터</button>
    <button class="drawer-item" data-menu="신비의 보석" data-page="gem.html">신비의 보석</button>
