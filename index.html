<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1930: 무법의 시대</title>
  <!-- 감성적인 명조체(Noto Serif KR) 로드 -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #f4f1ea; /* 시안과 같은 따뜻한 미색 종이 배경 */
      color: #1c1b18;
      font-family: 'Noto Sans KR', sans-serif;
      overflow-x: hidden;
    }

    /* 1. 상단 고정 헤더 및 선 */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background-color: rgba(244, 241, 234, 0.94);
      border-bottom: 1px solid #d5cfc2; /* 상단 고정 선 */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      z-index: 9000;
      backdrop-filter: blur(5px);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #1c1b18;
    }

    .logo-icon {
      font-size: 1.2rem;
      color: #8c7a5b;
    }

    .logo-text {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .logo-sub {
      font-size: 0.72rem;
      color: #7d776c;
      display: block;
      font-weight: 400;
    }

    /* 우측 상단 선 3개 메뉴 버튼 */
    .hamburger-btn {
      background: transparent;
      border: 1px solid #c7c0b2;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 38px;
      height: 34px;
      padding: 8px 7px;
      z-index: 9100;
    }

    .hamburger-btn span {
      display: block;
      width: 100%;
      height: 2px;
      background-color: #1c1b18;
    }

    /* 2. 오른쪽에서 열리는 사이드창 */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(28, 27, 24, 0.45);
      display: none;
      z-index: 9500;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: -280px;
      width: 270px;
      height: 100vh;
      background-color: #f4f1ea;
      border-left: 1px solid #d5cfc2;
      display: flex;
      flex-direction: column;
      padding-top: 22px;
      z-index: 9900;
      transition: right 0.3s ease;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.12);
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px 18px;
      border-bottom: 1px solid #d5cfc2;
    }

    .sidebar-title {
      font-family: 'Noto Serif KR', serif;
      color: #8c7a5b;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 2px;
    }

    .close-sidebar-btn {
      background: none;
      border: none;
      color: #1c1b18;
      font-size: 1.7rem;
      line-height: 1;
      cursor: pointer;
    }

    .sidebar-links {
      display: flex;
      flex-direction: column;
    }

    .sidebar-links a {
      padding: 18px 24px;
      text-decoration: none;
      color: #1c1b18;
      font-family: 'Noto Serif KR', serif;
      font-size: 1.05rem;
      font-weight: 600;
      border-bottom: 1px solid #e6e0d4;
      transition: background-color 0.2s, padding-left 0.2s;
    }

    .sidebar-links a:hover {
      background-color: #eae4d7;
      padding-left: 30px;
    }

    /* 3. 메인 히어로 섹션 (좌측 텍스트 + 우측 이미지 배치) */
    #main-section {
      min-height: 100vh;
      padding: 110px 6% 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid #e0dad0;
    }

    .hero-container {
      max-width: 1150px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 50px;
    }

    /* 왼쪽 영역: 경성 스토리 타이포그래피 & 버튼 */
    .hero-left {
      flex: 1.1;
      text-align: left;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.78rem;
      letter-spacing: 2.5px;
      color: #8c7a5b;
      text-transform: uppercase;
      margin-bottom: 24px;
      font-weight: 500;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 1px;
      background-color: #8c7a5b;
    }

    .hero-sub-lead {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.15rem;
      color: #5c564c;
      margin-bottom: 12px;
      font-weight: 400;
    }

    .hero-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 3.1rem;
      line-height: 1.32;
      font-weight: 700;
      color: #1c1b18;
      margin-bottom: 26px;
      letter-spacing: -1px;
    }

    .hero-desc {
      font-size: 0.98rem;
      line-height: 1.8;
      color: #666055;
      margin-bottom: 38px;
      word-break: keep-all;
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background-color: #1c1b18;
      color: #f4f1ea;
      border: 1px solid #1c1b18;
      padding: 15px 28px;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: #38352f;
    }

    .btn-outline {
      background-color: transparent;
      color: #1c1b18;
      border: 1px solid #c7c0b2;
      padding: 15px 26px;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .btn-outline:hover {
      border-color: #1c1b18;
      background-color: #eae4d7;
    }

    /* 오른쪽 영역: 사진 & 캡션 & 도장 */
    .hero-right {
      flex: 0.9;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      position: relative;
    }

    .photo-frame-wrap {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      max-width: 420px;
      width: 100%;
    }

    .photo-box {
      position: relative;
      width: 100%;
      background-color: #e6e0d4;
      box-shadow: 0 20px 45px rgba(28, 27, 24, 0.12);
      overflow: hidden;
    }

    .photo-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 시안 우측 세로 영문 텍스트 */
    .vertical-tag {
      writing-mode: vertical-rl;
      font-size: 0.68rem;
      letter-spacing: 3px;
      color: #9e9689;
      padding-top: 6px;
      user-select: none;
    }

    /* 시안 사진 아래 캡션 */
    .photo-caption {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-right: 22px;
      font-size: 0.75rem;
      color: #7d776c;
      letter-spacing: 1px;
    }

    .photo-caption .dot {
      color: #9e2a2b;
      margin-right: 6px;
    }

    /* 네모 도장 (1회만 찍힘) */
    .stamp {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(3) rotate(-12deg);
      border: 4px solid #a61c1c;
      color: #a61c1c;
      font-family: 'Noto Serif KR', serif;
      font-size: 2.1rem;
      font-weight: 900;
      padding: 8px 22px;
      letter-spacing: 4px;
      background-color: rgba(244, 241, 234, 0.75);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .stamp.stamped {
      animation: stampHit 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes stampHit {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(3.5) rotate(-12deg);
      }
      70% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.95) rotate(-12deg);
      }
      100% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(1) rotate(-12deg);
      }
    }

    /* 하단 SCROLL TO EXPLORE 문구 */
    .scroll-hint {
      position: absolute;
      bottom: 24px;
      left: 6%;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: #8c7a5b;
    }

    /* 4. 아래 콘텐츠 섹션들 (세계관, 웹툰, 세력, 등장인물, 신비의 보석) */
    .content-section {
      min-height: 90vh;
      padding: 100px 6%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid #e0dad0;
    }

    .section-inner {
      max-width: 900px;
      width: 100%;
    }

    .section-label {
      font-size: 0.75rem;
      letter-spacing: 2.5px;
      color: #8c7a5b;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .section-inner h2 {
      font-family: 'Noto Serif KR', serif;
      font-size: 2.1rem;
      color: #1c1b18;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #d5cfc2;
    }

    .section-inner p {
      font-size: 1rem;
      line-height: 1.8;
      color: #4f4a41;
      margin-bottom: 20px;
    }

    .prompt-card {
      background-color: #ebe6dc;
      border: 1px solid #d5cfc2;
      padding: 24px;
      font-family: 'Noto Serif KR', serif;
      line-height: 1.8;
      color: #2b2925;
      white-space: pre-wrap;
    }

    /* 5. 우측 하단 고정 음악 버튼 */
    .music-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: #1c1b18;
      color: #f4f1ea;
      border: 1px solid #1c1b18;
      padding: 12px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
