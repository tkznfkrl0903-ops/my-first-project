<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1930 - 무법의 시대</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #3b2616 0%, #170e08 75%, #0a0604 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', serif;
      position: relative;
    }

    /* 거친 필름 및 모래바람 질감 효과 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.12) 0px,
        rgba(0, 0, 0, 0.12) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* 현상금 수배서 전체 컨테이너 */
    .poster-wrapper {
      position: relative;
      z-index: 2;
      width: min(92vw, 440px);
      aspect-ratio: 416 / 550;
      background-image: url('wanted.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 25px rgba(212, 163, 89, 0.15);
      transform: rotate(-1deg);
      transition: transform 0.3s ease;
    }

    /* 수배서 중앙 사각형 빈칸에 들어가는 타이틀 이미지 */
    .title-box {
      position: absolute;
      top: 23.2%;
      left: 9.2%;
      width: 81.6%;
      height: 41.2%;
      background-color: #0b0e14;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .title-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 하단 중앙 버튼 영역 */
    .action-area {
      position: absolute;
      bottom: 8.2%;
      left: 11%;
      width: 78%;
      text-align: center;
    }

    .sub-caption {
      font-size: clamp(10px, 2.5vw, 13px);
      font-weight: 800;
      color: #2b1a0e;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .menu-btn {
      flex: 1;
      padding: 11px 6px;
      background-color: #26160c;
      color: #e6c896;
      border: 2px solid #4a2c18;
      font-size: clamp(13px, 3.3vw, 16px);
      font-weight: bold;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    /* 캐릭터 보기(사이드 메뉴 느낌) 포인트 스타일 */
    .menu-btn.secondary {
      background-color: #3d2414;
      color: #f0d7ad;
    }

    .menu-btn:hover {
      background-color: #7a1c12;
      color: #fff5e4;
      border-color: #26160c;
      transform: translateY(-2px);
    }

    .menu-btn:active {
      transform: translateY(1px);
    }

    /* 붉은색 인주 도장 스타일 및 애니메이션 */
    .stamp {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%) scale(3) rotate(-18deg);
      border: 5px solid rgba(168, 24, 24, 0.88);
      color: rgba(168, 24, 24, 0.88);
      font-size: clamp(24px, 6.5vw, 34px);
      font-weight: 900;
      padding: 8px 18px;
      letter-spacing: 4px;
      text-transform: uppercase;
      background-color: rgba(168, 24, 24, 0.06);
      box-shadow: inset 0 0 8px rgba(168, 24, 24, 0.4);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
    }

    /* 도장이 쾅 찍힐 때 실행되는 클래스 */
    .stamp.stamped {
      animation: stampSlam 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes stampSlam {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(3.2) rotate(-25deg);
      }
      70% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(0.95) rotate(-14deg);
      }
      100% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1) rotate(-15deg);
      }
    }
  </style>
</head>
<body>

  <div class="poster-wrapper" id="poster">
    <!-- 수배서 중앙 타이틀 이미지 -->
    <div class="title-box">
      <img src="title.png" alt="1930 무법의 시대">
    </div>

    <!-- 도장 연출 요소 -->
    <div class="stamp" id="stampMark">개시 승인</div>

    <!-- 하단 중앙 버튼 영역 -->
    <div class="action-area">
      <div class="sub-caption">REWARD : $10,000 GOLD</div>
      <div class="btn-group">
        <button class="menu-btn" onclick="triggerStamp('프롤로그 개시', 'prologue.html')">프롤로그 열기</button>
        <button class="menu-btn secondary" onclick="triggerStamp('수배자 열람', 'characters.html')">캐릭터 보기</button>
      </div>
    </div>
  </div>

  <script>
    let isStamping = false;

    function triggerStamp(stampText, targetPage) {
      if (isStamping) return;
      isStamping = true;

      const stamp = document.getElementById('stampMark');
      const poster = document.getElementById('poster');

      // 도장 문구 변경 및 애니메이션 초기화
      stamp.textContent = stampText;
      stamp.classList.remove('stamped');
      void stamp.offsetWidth; // 리플로우 강제 실행
      stamp.classList.add('stamped');

      // 도장이 찍히는 순간 수배서가 살짝 흔들리는 타격감 연출
      setTimeout(() => {
        poster.style.transform = 'rotate(-0.5deg) scale(0.985)';
      }, 220);

      setTimeout(() => {
        poster.style.transform = 'rotate(-1deg) scale(1)';
      }, 360);

      // 도장이 찍힌 후 다음 동작 실행 (추후 페이지 연결)
      setTimeout(() => {
        alert("[" + stampText + "] 도장이 찍혔습니다!\n(다음 작업 시 " + targetPage + " 페이지로 연결됩니다.)");
        isStamping = false;
      }, 950);
    }
  </script>

</body>
</html>
