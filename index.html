<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1930 - 무법의 시대</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Rye&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 42%, #59381d 0%, #2b190d 55%, #120a05 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: 'Noto Serif KR', 'Malgun Gothic', serif;
      position: relative;
    }
    .desert-atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .sand-wind {
      position: absolute;
      left: -100%;
      width: 200%;
      height: 140px;
      background: linear-gradient(90deg, transparent 0%, rgba(218, 168, 108, 0.1) 25%, rgba(235, 190, 130, 0.18) 50%, rgba(218, 168, 108, 0.1) 75%, transparent 100%);
      filter: blur(18px);
      animation: windBlow 7s linear infinite;
    }
    .sand-wind.wind-1 { top: 28%; animation-duration: 6.5s; }
    .sand-wind.wind-2 { top: 58%; animation-duration: 8.5s; animation-delay: -3s; height: 180px; }
    .sand-wind.wind-3 { bottom: 8%; animation-duration: 5.5s; animation-delay: -1.5s; height: 110px; }
    @keyframes windBlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(50%); }
    }
    .dust-particle {
      position: absolute;
      background-color: rgba(235, 192, 132, 0.6);
      border-radius: 50%;
      animation: dustFly linear infinite;
    }
    @keyframes dustFly {
      0% { transform: translateX(-10vw) translateY(0); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateX(110vw) translateY(-35px); opacity: 0; }
    }
    .tumbleweed-container {
      position: fixed;
      bottom: 6%;
      left: -140px;
      width: 110px;
      height: 110px;
      pointer-events: none;
      z-index: 3;
      animation: tumbleAcross 9s linear infinite;
    }
    .tumbleweed-bounce {
      width: 100%;
      height: 100%;
      animation: tumbleBounce 1.1s ease-in-out infinite alternate;
    }
    .tumbleweed-spin {
      width: 100%;
      height: 100%;
      animation: tumbleRotate 2.4s linear infinite;
      filter: drop-shadow(0 12px 8px rgba(0, 0, 0, 0.7));
    }
    .tumbleweed-container.small {
      bottom: 16%;
      width: 68px;
      height: 68px;
      opacity: 0.75;
      z-index: 2;
      animation: tumbleAcross 12s linear infinite;
      animation-delay: 4.5s;
    }
    @keyframes tumbleAcross {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 280px)); }
    }
    @keyframes tumbleBounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-28px); }
    }
    @keyframes tumbleRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .top-header {
      position: relative;
      z-index: 20;
      width: 100%;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(12, 7, 4, 0.88) 0%, rgba(12, 7, 4, 0.35) 100%);
      border-bottom: 2px solid #8c6239;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.65);
    }
    .site-title {
      font-family: 'Rye', 'Noto Serif KR', serif;
      font-size: clamp(20px, 3.8vw, 30px);
      color: #e6c384;
      letter-spacing: 2px;
      text-shadow: 2px 3px 0px #1a0d06;
      user-select: none;
    }
    .hamburger-btn {
      width: 38px;
      height: 32px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 2px;
    }
    .hamburger-btn span {
      display: block;
      width: 100%;
      height: 3.5px;
      background-color: #e6c384;
      border-radius: 2px;
    }
    .side-drawer {
      position: fixed;
      top: 0;
      right: -280px;
      width: 260px;
      height: 100vh;
      background: linear-gradient(180deg, #1f1209 0%, #120a05 100%);
      border-left: 2px solid #8c6239;
      z-index: 50;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: right 0.3s ease;
    }
    .side-drawer.open { right: 0; }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #5e4024;
      color: #e6c384;
      font-family: 'Rye', 'Noto Serif KR', serif;
      font-size: 18px;
    }
    .close-btn {
      background: none;
      border: none;
      color: #e6c384;
      font-size: 26px;
      cursor: pointer;
    }
    .drawer-item {
      padding: 12px 14px;
      background-color: #2b190e;
      color: #e6c896;
      border: 1px solid #5e4024;
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .drawer-item:hover {
      background-color: #7a1c12;
      color: #fff5e4;
    }
    .main-stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      position: relative;
      z-index: 10;
    }
    .poster-wrapper {
      position: relative;
      width: min(90vw, 490px, 63vh);
      aspect-ratio: 416 / 550;
      background-color: #c8a265;
      background-image: url('poster.png'), url('poster.jpg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow: 0 28px 65px rgba(0, 0, 0, 0.88);
      transform: rotate(-1deg);
      transition: transform 0.25s ease;
    }
    .action-area {
      position: absolute;
      bottom: 8.2%;
      left: 11%;
      width: 78%;
      text-align: center;
      z-index: 15;
    }
    .sub-caption {
      font-size: clamp(11px, 2.4vw, 14px);
      font-weight: 800;
      color: #2b1a0e;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .menu-btn {
      flex: 1;
      padding: 12px 8px;
      background-color: #26160c;
      color: #e6c896;
      border: 2px solid #4a2c18;
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(13px, 3.2vw, 17px);
      font-weight: bold;
      letter-spacing: 1.5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .menu-btn.secondary { background-color: #3d2414; color: #f0d7ad; }
    .menu-btn:hover { background-color: #7a1c12; color: #fff5e4; }
    .stamp {
      position: absolute;
      top: 44%;
      left: 50%;
      width: clamp(190px, 46vw, 250px);
      height: clamp(190px, 46vw, 250px);
      border-radius: 50%;
      border: 9px solid rgba(185, 18, 18, 0.95);
      outline: 3px solid rgba(185, 18, 18, 0.85);
      outline-offset: -17px;
      color: rgba(185, 18, 18, 0.96);
      font-size: clamp(52px, 12.5vw, 74px);
      font-weight: 900;
      letter-spacing: 6px;
      padding-left: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(185, 18, 18, 0.12);
      transform: translate(-50%, -50%) scale(3.2) rotate(-18deg);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      user-select: none;
    }
    .stamp.stamped {
      animation: stampSlam 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }
    @keyframes stampSlam {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(3.4) rotate(-25deg); }
      70% { opacity: 0.98; transform: translate(-50%, -50%) scale(0.94) rotate(-12deg); }
      100% { opacity: 0.95; transform: translate(-50%, -50%) scale(1) rotate(-14deg); }
    }
    .music-toggle-btn {
      position: fixed;
      bottom: 20px;
      right: 22px;
      z-index: 45;
      padding: 10px 16px;
      background-color: rgba(32, 18, 10, 0.92);
      color: #e6c384;
      border: 2px solid #8c6239;
      border-radius: 30px;
      font-family: 'Noto Serif KR', serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .music-toggle-btn.playing { border-color: #d99b43; box-shadow: 0 0 15px rgba(217, 155, 67, 0.45); }
  </style>
</head>
<body>

  <div class="desert-atmosphere" id="desertLayer">
    <div class="sand-wind wind-1"></div>
    <div class="sand-wind wind-2"></div>
    <div class="sand-wind wind-3"></div>
  </div>

  <div class="tumbleweed-container">
    <div class="tumbleweed-bounce">
      <svg class="tumbleweed-spin" viewBox="0 0 120 120" fill="none">
        <g stroke="#9c7244" stroke-width="2.4" stroke-linecap="round">
          <path d="M60 12 C90 12, 108 35, 106 62 C104 90, 82 108, 56 107 C28 106, 12 84, 14 56 C16 30, 36 14, 62 15"/>
          <path d="M25 32 C55 18, 92 38, 94 72 C95 96, 62 105, 38 92 C18 80, 18 48, 42 26"/>
          <path d="M78 20 C98 44, 88 86, 58 98 C32 108, 16 78, 28 48 C38 24, 66 16, 86 38"/>
          <path d="M18 65 C35 35, 78 28, 98 55 C112 75, 85 102, 52 98 C25 94, 15 68, 35 42"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="tumbleweed-container small">
    <div class="tumbleweed-bounce">
      <svg class="tumbleweed-spin" viewBox="0 0 120 120" fill="none">
        <g stroke="#855e35" stroke-width="2.6" stroke-linecap="round">
          <path d="M60 12 C90 12, 108 35, 106 62 C104 90, 82 108, 56 107 C28 106, 12 84, 14 56 C16 30, 36 14, 62 15"/>
          <path d="M25 32 C55 18, 92 38, 94 72 C95 96, 62 105, 38 92 C18 80, 18 48, 42 26"/>
