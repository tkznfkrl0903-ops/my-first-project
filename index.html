<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1930: 무법의 시대</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #120e0a;
      color: #e6d8c3;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', serif;
      overflow-x: hidden;
    }

    /* 1. 상단 고정 헤더 및 선 */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background-color: rgba(18, 14, 10, 0.95);
      border-bottom: 2px solid #8c6d46;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      color: #d4af37;
      text-shadow: 2px 2px 4px #000;
      white-space: nowrap;
    }

    /* 오른쪽 상단 선 3개(햄버거) 버튼 */
    .hamburger-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 28px;
      height: 20px;
      padding: 0;
      z-index: 1100;
    }

    .hamburger-btn span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: #d4af37;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* 선 3개 눌렀을 때 펼쳐지는 드롭다운 메뉴 */
    .dropdown-menu {
      position: fixed;
      top: 65px;
      right: 0;
      width: 200px;
      background-color: rgba(24, 18, 13, 0.98);
      border-left: 2px solid #8c6d46;
      border-bottom: 2px solid #8c6d46;
      display: none;
      flex-direction: column;
      z-index: 1050;
      box-shadow: -5px 10px 20px rgba(0, 0, 0, 0.9);
    }

    .dropdown-menu.open {
      display: flex;
    }

    .dropdown-menu a {
      padding: 16px 24px;
      text-decoration: none;
      color: #e6d8c3;
      font-size: 1.1rem;
      font-weight: bold;
      border-bottom: 1px solid #3d2e1e;
      transition: background-color 0.2s, color 0.2s;
    }

    .dropdown-menu a:last-child {
      border-bottom: none;
    }

    .dropdown-menu a:hover, .dropdown-menu a:active {
      background-color: #3a2a1d;
      color: #d4af37;
    }

    /* 섹션 공통 레이아웃 */
    section {
      min-height: 100vh;
      padding: 85px 15px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      border-bottom: 1px dashed #3d2e1e;
    }

    /* 2. 메인 섹션: 정중앙 현상수배서 포스터 */
    #main-section {
      background: radial-gradient(circle, #261d15 0%, #120e0a 100%);
    }

    .poster-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 400px;
      width: 90%;
    }

    .poster-img {
      width: 100%;
      height: auto;
      border: 5px solid #4a3520;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
      border-radius: 4px;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
      margin-top: 22px;
      z-index: 10;
      width: 100%;
      justify-content: center;
    }

    .btn-1930 {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      color: #120e0a;
      background-color: #d4af37;
      border: 2px solid #8c6d46;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s, background-color 0.2s;
      flex: 1;
      max-width: 160px;
    }

    .btn-1930:hover {
      background-color: #f0c94d;
    }

    .btn-1930.secondary {
      background-color: #3a2a1d;
      color: #e6d8c3;
    }

    /* 3. 네모 도장 애니메이션 */
    .stamp {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(3) rotate(-12deg);
      border: 5px solid #b81d13;
      color: #b81d13;
      font-size: 2.3rem;
      font-weight: 900;
      padding: 8px 24px;
      letter-spacing: 4px;
      background-color: rgba(184, 29, 19, 0.15);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
    }

    .stamp.stamped {
      animation: stampHit 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes stampHit {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(3.5) rotate(-12deg);
      }
      70% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.95) rotate(-12deg);
      }
      100% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(1) rotate(-12deg);
      }
    }

    /* 4. 프롬프트 & 캐릭터 섹션 */
    .content-box {
      max-width: 750px;
      width: 95%;
      background-color: #1c1610;
      border: 2px solid #5e472c;
      padding: 30px 20px;
      border-radius: 6px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .content-box h2 {
      color: #d4af37;
      font-size: 1.6rem;
      margin-bottom: 15px;
      border-bottom: 1px solid #5e472c;
      padding-bottom: 10px;
    }

    .prompt-area {
      background-color: #120e0a;
      border: 1px solid #8c6d46;
      padding: 18px;
      color: #cbbba0;
      font-family: monospace;
      text-align: left;
      line-height: 1.6;
      margin-top: 15px;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }

    /* 5. 우측 하단 고정 음악 버튼 */
    .music-toggle {
      position: fixed;
      bottom: 25px;
      right: 20px;
      background-color: #2b2016;
      color: #d4af37;
      border: 2px solid #d4af37;
      padding: 12px 18px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 2000;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.9);
      transition: all 0.2s;
    }

    .music-toggle.playing {
      background-color: #d4af37;
      color: #120e0a;
    }
  </style>
</head>
<body>

  <!-- 상단 고정 헤더 -->
  <header>
    <div class="logo">1930: 무법의 시대</div>
    <!-- 선 3개 메뉴 버튼 -->
    <button class="hamburger-btn" onclick="toggleMenu()" aria-label="메뉴 열기">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- 선 3개 누르면 나오는 메뉴 3개 -->
  <nav id="dropdown-menu" class="dropdown-menu">
    <a href="#main-section" onclick="closeMenu()">현상수배</a>
    <a href="#prompt-section" onclick="closeMenu()">프롬프트</a>
    <a href="#character-section" onclick="closeMenu()">캐릭터</a>
  </nav>

  <!-- 1번 화면: 정중앙 현상수배서 포스터 -->
  <section id="main-section">
    <div class="poster-wrapper">
      <img src="poster.png" alt="현상수배서 포스터" class="poster-img">
      
      <div id="stamp-box" class="stamp">수배 개시</div>

      <div class="action-buttons">
        <button class="btn-1930" onclick="triggerStampAndScroll('prompt-section')">프롬프트 열기</button>
        <button class="btn-1930 secondary" onclick="triggerStampAndScroll('character-section')">캐릭터 보기</button>
      </div>
    </div>
  </section>

  <!-- 2번 화면: 프롬프트 섹션 -->
  <section id="prompt-section">
    <div class="content-box">
      <h2>세계관 & 프롬프트</h2>
      <p>1930년대 무법의 시대를 배경으로 한 설정과 프롬프트 공간입니다.</p>
      <div class="prompt-area" id="prompt-text">[1930: 무법의 시대]
이곳에 원하시는 프롬프트 내용을 입력해 주세요.</div>
    </div>
  </section>

  <!-- 3번 화면: 캐릭터 섹션 -->
  <section id="character-section">
    <div class="content-box">
      <h2>주요 수배자 명단</h2>
      <p>주요 등장인물과 현상수배 전단입니다.</p>
      <div style="margin-top: 20px;">
        <img src="wanted.png.jpg" alt="캐릭터 이미지" style="max-width: 100%; width: 280px; border: 3px solid #8c6d46;">
      </div>
    </div>
  </section>

  <!-- 오른쪽 하단 고정 음악 버튼 -->
  <button id="music-btn" class="music-toggle" onclick="toggleMusic()">🔇 음악 켜기</button>

  <script>
    // 1. 햄버거(선 3개) 메뉴 열기/닫기
    const dropdownMenu = document.getElementById('dropdown-menu');

    function toggleMenu() {
      dropdownMenu.classList.toggle('open');
    }

    function closeMenu() {
      dropdownMenu.classList.remove('open');
    }

    // 2. 오디오 컨텍스트 (도장 소리 & 배경음악 공용)
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 도장 찍히는 소리
    function playStampSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.15);

      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    }

    // 버튼 클릭 시 도장 찍기 + 아래로 휠 이동
    function triggerStampAndScroll(targetId) {
      closeMenu();
      const stamp = document.getElementById('stamp-box');
      
      stamp.classList.remove('stamped');
      void stamp.offsetWidth;
      stamp.classList.add('stamped');

      playStampSound();

      setTimeout(() => {
        const targetElement = document.getElementById(targetId);
        if (targetElement) {
          targetElement.scrollIntoView({ behavior: 'smooth' });
        }
      }, 600);
    }

    // 3. 음악 켜기 / 끄기 (외부 파일 차단 없는 1930년대 느와르 재즈 코드 루프)
    let isPlaying = false;
    let bgmInterval = null;
    const musicBtn = document.getElementById('music-btn');

    // 어둡고 분위기 있는 1930년대 재즈 코드 진행 (Dm9 -> G13 -> Cmaj9 -> A7b9)
    const chords = [
      [146.83, 174.61, 220.00, 261.63, 329.63], // Dm9
      [196.00, 246.94, 349.23, 440.00, 659.25], // G13
